<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everyday Fit — Workout</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        /* NAV */
        nav {
            background: #000;
            border-bottom: 2px solid #1a1a1a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #fff;
            text-decoration: none;
        }
        .nav-logo span { color: #CC0000; }

        .nav-right { display: flex; align-items: center; gap: 1.5rem; }

        .btn-back {
            font-size: 0.78rem;
            color: #444;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #888; }

        .btn-regen {
            font-size: 0.78rem;
            color: #CC0000;
            background: none;
            border: 1px solid #330000;
            border-radius: 4px;
            padding: 0.45rem 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            transition: all 0.2s;
        }
        .btn-regen:hover { background: #CC0000; color: #fff; }

        /* MAIN */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        .page-title {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.4rem;
        }
        .page-title span { color: #CC0000; }
        .page-sub {
            font-size: 0.85rem;
            color: #444;
            margin-bottom: 3rem;
        }

        /* ================================
           SLOT MACHINE
           ================================ */
        .slot-machine {
            max-width: 620px;
            margin: 0 auto 2rem;
            text-align: center;
            transition: opacity 0.5s, transform 0.5s;
        }
        .slot-machine.slot-fadeout {
            opacity: 0;
            transform: scale(0.97);
        }

        .slot-message {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #CC0000;
            margin-bottom: 1.5rem;
            min-height: 1.4rem;
        }

        .slot-reels {
            display: flex;
            gap: 1rem;
            justify-content: center;
            background: #000;
            border: 2px solid #CC0000;
            border-radius: 10px;
            padding: 2rem 1.5rem;
            box-shadow: 0 0 30px rgba(204,0,0,0.2), inset 0 0 20px rgba(0,0,0,0.5);
        }

        .slot-reel {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #1e1e1e;
            border-radius: 6px;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 0.5rem;
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        .reel-label {
            font-size: 0.68rem;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .reel-text {
            font-size: 0.95rem;
            font-weight: 700;
            color: #666;
            text-align: center;
            line-height: 1.3;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .slot-reel.reel-stopped {
            border-color: #CC0000;
            box-shadow: 0 0 15px rgba(204,0,0,0.3);
        }
        .slot-reel.reel-stopped .reel-text {
            color: #fff;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0%   { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* ================================
           EXERCICES
           ================================ */
        .exercises-container {
            display: flex;
            flex-direction: row;
            gap: 1.2rem;
            justify-content: center;
            align-items: flex-start;
        }

        .exercise-card {
            flex: 1;
            min-width: 0;
            background: #111;
            border: 1px solid #1e1e1e;
            border-radius: 6px;
            padding: 1.5rem;
            transition: all 0.4s ease;
        }

        .exercise-locked {
            opacity: 0.35;
            filter: grayscale(80%);
            transform: scale(0.97);
        }

        .exercise-active {
            border-color: #CC0000;
            box-shadow: 0 0 25px rgba(204,0,0,0.2);
            transform: scale(1.03);
        }

        .exercise-completed {
            opacity: 0.7;
            border-color: #1a4a1a;
            background: #0d1f0d;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .exercise-number {
            width: 32px;
            height: 32px;
            background: #CC0000;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .exercise-completed .exercise-number {
            background: #22c55e;
        }

        .exercise-status { font-size: 1.2rem; }

        .exercise-name {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .exercise-details {
            font-size: 0.9rem;
            color: #CC0000;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.8rem;
        }

        .exercise-description {
            font-size: 0.82rem;
            color: #444;
            line-height: 1.6;
            margin-bottom: 1rem;
            font-style: italic;
        }

        .btn-show-video {
            background: none;
            border: 1px solid #1e1e1e;
            color: #444;
            padding: 0.35rem 0.8rem;
            border-radius: 3px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            display: block;
        }
        .btn-show-video:hover {
            border-color: #CC0000;
            color: #CC0000;
        }

        .video-container { margin-bottom: 1rem; }
        .video-container video { width: 100%; border-radius: 4px; }

        .btn-exercise-done {
            width: 100%;
            padding: 0.9rem;
            background: #22c55e;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-exercise-done:hover { background: #16a34a; }
        .btn-exercise-done:disabled {
            background: #1a1a1a;
            color: #333;
            cursor: not-allowed;
        }

        .completed-label {
            font-size: 0.8rem;
            color: #22c55e;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .locked-label {
            font-size: 0.8rem;
            color: #2a2a2a;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Bouton final */
        .btn-complete {
            display: block;
            width: 100%;
            max-width: 420px;
            margin: 3rem auto 0;
            padding: 1.3rem;
            background: #CC0000;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 25px rgba(204,0,0,0.35);
        }
        .btn-complete:hover {
            background: #EE0000;
            transform: scale(1.03);
            box-shadow: 0 10px 35px rgba(204,0,0,0.5);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">Everyday<span>Fit</span></a>
        <div class="nav-right">
            <button class="btn-regen" id="btnRegen" onclick="regenWorkout()">↺ Nouveau workout</button>
            <a href="dashboard.html" class="btn-back">← Dashboard</a>
        </div>
    </nav>

    <main>
        <h2 class="page-title">Ton <span>workout</span> du jour</h2>
        <p class="page-sub">Complète les 3 exercices pour gagner 100 points</p>

        <!-- Slot machine -->
        <div id="slotMachine" class="slot-machine">
            <p class="slot-message" id="slotMessage">Génération en cours...</p>
            <div class="slot-reels">
                <div class="slot-reel" id="reel-0">
                    <div class="reel-label">Exercice 1</div>
                    <div class="reel-text" id="reel-text-0">???</div>
                </div>
                <div class="slot-reel" id="reel-1">
                    <div class="reel-label">Exercice 2</div>
                    <div class="reel-text" id="reel-text-1">???</div>
                </div>
                <div class="slot-reel" id="reel-2">
                    <div class="reel-label">Exercice 3</div>
                    <div class="reel-text" id="reel-text-2">???</div>
                </div>
            </div>
        </div>

        <!-- Exercices -->
        <div id="exercisesContainer" class="exercises-container hidden"></div>

        <!-- Bouton terminer -->
        <button id="btnComplete" class="btn-complete hidden">
            Workout terminé — +100 pts
        </button>
    </main>

    <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    const params    = new URLSearchParams(window.location.search);
    let workoutId   = params.get('id');
    if (!workoutId) { window.location.href = 'dashboard.html'; }

    const API = 'http://localhost:8000/api';
    const exercisesContainer = document.getElementById('exercisesContainer');
    const btnComplete        = document.getElementById('btnComplete');
    let exercises        = [];
    let currentExercise  = 0;

    const FAKE_NAMES = [
        'Squats', 'Burpees', 'Pompes', 'Fentes', 'Gainage', 'Dips',
        'Crunchs', 'Mountain Climbers', 'Jumping Jacks', 'Plank',
        'Superman', 'Hip Thrust', 'Box Jump', 'Triceps', 'Biceps'
    ];

    // ================================
    // SLOT MACHINE
    // ================================
    function runSlotMachine(onComplete) {
        const messages  = ['Génération en cours...', 'Intéressant...', 'Presque prêt...', "C'est parti !"];
        const stopTimes = [3000, 5500, 7500];
        const slotMsg   = document.getElementById('slotMessage');

        const intervals = [0, 1, 2].map(i => {
            const el = document.getElementById(`reel-text-${i}`);
            return setInterval(() => {
                el.textContent = FAKE_NAMES[Math.floor(Math.random() * FAKE_NAMES.length)];
            }, 80);
        });

        stopTimes.forEach((delay, i) => {
            setTimeout(() => {
                clearInterval(intervals[i]);
                document.getElementById(`reel-text-${i}`).textContent = exercises[i].exercise.name;
                document.getElementById(`reel-${i}`).classList.add('reel-stopped');
                slotMsg.textContent = messages[i + 1];
            }, delay);
        });

        setTimeout(() => {
            const slot = document.getElementById('slotMachine');
            slot.classList.add('slot-fadeout');
            setTimeout(() => {
                slot.classList.add('hidden');
                exercisesContainer.classList.remove('hidden');
                onComplete();
            }, 500);
        }, 8800);
    }

    // ================================
    // CHARGER LE WORKOUT
    // ================================
    async function loadWorkout() {
        try {
            const res = await fetch(`${API}/workouts/${workoutId}`, {
                headers: { Authorization: `Bearer ${token}` }
            });
            if (!res.ok) { window.location.href = 'dashboard.html'; return; }
            const workout = await res.json();
            exercises = workout.exercises || [];
            if (exercises.length === 0) {
                document.getElementById('slotMachine').classList.add('hidden');
                exercisesContainer.classList.remove('hidden');
                exercisesContainer.innerHTML = '<p style="color:#444;text-align:center;">Aucun exercice trouvé.</p>';
                return;
            }
            runSlotMachine(() => renderExercises());
        } catch (e) {
            window.location.href = 'dashboard.html';
        }
    }

    // ================================
    // REGÉNÉRER UN WORKOUT
    // ================================
    async function regenWorkout() {
        const btn = document.getElementById('btnRegen');
        btn.disabled = true;
        btn.textContent = '...';
        try {
            const res = await fetch(`${API}/workouts/generate`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }
            });
            if (res.ok) {
                const w = await res.json();
                window.location.href = `workout.html?id=${w.id}`;
            } else {
                btn.disabled = false;
                btn.textContent = '↺ Nouveau workout';
            }
        } catch (e) {
            btn.disabled = false;
            btn.textContent = '↺ Nouveau workout';
        }
    }

    // ================================
    // RENDER EXERCICES
    // ================================
    function toggleVideo(index) {
        const videoDiv = document.getElementById(`video-${index}`);
        const btn      = document.getElementById(`btn-video-${index}`);
        const isHidden = videoDiv.classList.contains('hidden');
        videoDiv.classList.toggle('hidden', !isHidden);
        if (isHidden) { const v = videoDiv.querySelector('video'); v.playbackRate = 1.3; v.play(); btn.textContent = '▼ Masquer'; }
        else          { videoDiv.querySelector('video').pause(); btn.textContent = '▶ Voir le mouvement'; }
    }

    function renderExercises() {
        exercisesContainer.innerHTML = exercises.map((ex, index) => {
            const isActive    = index === currentExercise;
            const isCompleted = index < currentExercise;
            const isLocked    = index > currentExercise;
            let cls = 'exercise-card';
            if (isActive)    cls += ' exercise-active';
            if (isCompleted) cls += ' exercise-completed';
            if (isLocked)    cls += ' exercise-locked';
            const statusIcon = isCompleted ? '✓' : isLocked ? '—' : '●';
            const details    = ex.target_reps ? `${ex.target_reps} répétitions` : `${ex.target_duration} secondes`;
            const videoUrl   = ex.exercise.gif_url ? `${API.replace('/api','')}${ex.exercise.gif_url}?v=2` : null;

            return `
            <div class="${cls}">
                <div class="exercise-header">
                    <div class="exercise-number">${index + 1}</div>
                    <div class="exercise-status">${statusIcon}</div>
                </div>
                <h3 class="exercise-name">${ex.exercise.name}</h3>
                <p class="exercise-details">${details}</p>
                <p class="exercise-description">${ex.exercise.description}</p>
                ${videoUrl ? `
                    <button class="btn-show-video" id="btn-video-${index}" onclick="toggleVideo(${index})">▶ Voir le mouvement</button>
                    <div id="video-${index}" class="video-container hidden">
                        <video src="${videoUrl}" loop muted playsinline></video>
                    </div>
                ` : ''}
                ${isActive    ? `<button class="btn-exercise-done" onclick="completeExercise()">✓ Terminé</button>` : ''}
                ${isCompleted ? `<p class="completed-label">Complété ✓</p>` : ''}
                ${isLocked    ? `<p class="locked-label">Verrouillé</p>` : ''}
            </div>`;
        }).join('');
    }

    function completeExercise() {
        currentExercise++;
        if (currentExercise >= exercises.length) btnComplete.classList.remove('hidden');
        renderExercises();
    }

    // ================================
    // TERMINER LE WORKOUT
    // ================================
    btnComplete.addEventListener('click', async () => {
        btnComplete.disabled = true;
        try {
            const res = await fetch(`${API}/workouts/${workoutId}/complete`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` }
            });
            if (res.ok) {
                window.location.href = 'dashboard.html';
            } else {
                alert('Erreur lors de la validation');
                btnComplete.disabled = false;
            }
        } catch (e) {
            alert('Erreur réseau');
            btnComplete.disabled = false;
        }
    });

    loadWorkout();
    </script>
</body>
</html>
