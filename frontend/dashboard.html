<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Everyday Fit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <h1 class="logo">
                <a href="index.html" style="color:white; text-decoration: none;">Everyday Fit</a>
            </h1>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="#" id="btnLogout" class="btn-logout">Déconnexion</a></li>
            </ul>
        </div>
    </nav>

    <section class="stats-section">
        <div class="container">
            <h2 class="section-title">Mes statistiques</h2>
            <div class="stats-cards">
                <div class="stat-card">
                    <div class="stat-icon">💪</div>
                    <h3 class="stat-value" id="totalPoints">0</h3>
                    <p class="stat-label">Points totaux</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🏋️</div>
                    <h3 class="stat-value" id="totalWorkouts">0</h3>
                    <p class="stat-label">Workouts complétés</p>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <h3 class="stat-value" id="successRate">0%</h3>
                    <p class="stat-label">Taux de réussite</p>
                </div>
            </div>
        </div>
    </section>

    <section class="workouts-section">
        <div class="container">
            <h2 class="section-title">Mes derniers workouts</h2>
            
            <div id="slotMachine" style="display: none; text-align: center; padding: 20px;">
                <div class="slot-reel" id="reel" style="font-size: 2em;">🏋️</div>
            </div>

            <button id="btnGenerate" class="btn-generate">Générer un nouveau workout 🔥</button>
            <div id="workoutsList" class="workouts-list">
                <p class="no-workouts">Aucun workout pour le moment.</p>
            </div>
        </div>
    </section>

    <section class="dlc-section">
        <div class="container">
            <h2 class="section-title">Editions disponibles</h2>
            
            <div class="dlc-carousel">
                <div class="dlc-cards">
                    <div class="dlc-card dlc-active">
                        <div class="dlc-badge">✅ ACTIF</div>
                        <h3 class="dlc-title">Bodyweight Edition</h3>
                    </div>
                    <div class="dlc-card dlc-locked" style="cursor: not-allowed; opacity: 0.7;">
                        <div class="dlc-badge">🔒 COMING SOON</div>
                        <h3 class="dlc-title">Salle/Equipement</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'login.html';

        // Logique de chargement
        async function loadStats() {
            try {
                const response = await fetch('http://localhost:8001/api/users/me/stats', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.status === 401) { localStorage.removeItem('token'); window.location.href = 'login.html'; return; }
                const data = await response.json();
                document.getElementById('totalPoints').textContent = data.total_points || 0;
                document.getElementById('totalWorkouts').textContent = data.completed_workouts || 0;
                document.getElementById('successRate').textContent = (data.success_rate || 0) + '%';
            } catch (err) { console.error('Erreur stats:', err); }
        }

        async function loadWorkouts() {
            try {
                const response = await fetch('http://localhost:8001/api/workouts/me/history', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                const list = document.getElementById('workoutsList');
                if (data.workouts?.length > 0) {
                    list.innerHTML = data.workouts.map(w => `
                        <div class="workout-item">
                            <p>Workout du ${new Date(w.created_at).toLocaleDateString()}</p>
                            <p>Points : ${w.total_points || 0}</p>
                        </div>
                    `).join('');
                }
            } catch (err) { console.error('Erreur workouts:', err); }
        }

        // Logic "Bandit Manchot" (Commentaire pour Claude)
        document.getElementById('btnGenerate').addEventListener('click', async () => {
            // TODO: Activer affichage #slotMachine
            // TODO: Ajouter interval pour animer le #reel
            // TODO: Effectuer le fetch réel
            // TODO: Stopper animation et rediriger
            try {
                const response = await fetch('http://localhost:8001/api/workouts/generate', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    const workout = await response.json();
                    window.location.href = `workout.html?id=${workout.id}`;
                }
            } catch (err) { alert('Erreur réseau'); }
        });

        document.getElementById('btnLogout').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        });

        loadStats();
        loadWorkouts();
    </script>
</body>
</html>
