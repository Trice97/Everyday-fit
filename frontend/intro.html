<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Everyday Fit — Présentation</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .intro-logo {
            font-family: Impact, 'Arial Black', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #fff;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeIn 0.8s ease forwards;
        }

        .intro-logo span { color: #CC0000; }

        .intro-text {
            font-family: Arial, sans-serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            color: #ccc;
            line-height: 2;
            text-align: center;
            max-width: 680px;
            min-height: 8rem;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #CC0000;
            vertical-align: middle;
            margin-left: 2px;
            animation: blink 0.7s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .intro-buttons {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 3.5rem;
            width: 100%;
            max-width: 480px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .intro-buttons.visible {
            opacity: 1;
        }

        .btn-yes {
            padding: 1.2rem 2rem;
            font-family: Arial, sans-serif;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #CC0000;
            color: #fff;
            transition: all 0.3s;
        }

        .btn-yes:hover {
            background: #EE0000;
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(204,0,0,0.45);
        }

        .btn-no {
            padding: 1rem 2rem;
            font-family: Arial, sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
            color: #555;
            transition: all 0.3s;
        }

        .btn-no:hover {
            color: #888;
            border-color: #444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ================================
           OVERLAY VIDÉO PAPA SWOLIO
           ================================ */
        .video-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .video-overlay.active {
            display: flex;
        }

        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay .skip-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255,255,255,0.12);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: background 0.2s;
            z-index: 10000;
        }

        .video-overlay .skip-btn:hover {
            background: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>

    <div class="intro-logo">Everyday<span>Fit</span></div>

    <div class="intro-text" id="introText">
        <span id="typed"></span><span class="cursor" id="cursor"></span>
    </div>

    <div class="intro-buttons" id="introButtons">
        <button class="btn-yes" onclick="window.location.href='login.html'">
            Je veux me prendre en main et me mettre au sport 💪
        </button>
        <button class="btn-no" onclick="playPapaSwolio()">
            Non merci, je n'aime pas le sport
        </button>
    </div>

    <!-- Overlay vidéo Papa Swolio -->
    <div class="video-overlay" id="videoOverlay">
        <button class="skip-btn" onclick="closeVideo()">✕ Fermer</button>
        <video id="swolio-video" autoplay playsinline>
            <!-- Change le nom du fichier si besoin -->
            <source src="videos/papa-swolio.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        // ================================================
        // TEXTE À MODIFIER ICI
        // ================================================
        const TEXT = `Everyday Fit, c'est une application gratuite pensée pour ceux qui veulent reprendre le sport sans prise de tête. Pas de salle, pas de matériel, pas d'excuse. Chaque jour, on te génère un workout personnalisé adapté à ton niveau. Tu le fais chez toi, à ton rythme. Rien de plus.`;
        // ================================================

        const SPEED = 22; // ms par lettre

        const typed   = document.getElementById('typed');
        const cursor  = document.getElementById('cursor');
        const buttons = document.getElementById('introButtons');

        let i = 0;
        function typeNext() {
            if (i < TEXT.length) {
                typed.textContent += TEXT[i];
                i++;
                setTimeout(typeNext, SPEED);
            } else {
                cursor.style.display = 'none';
                buttons.classList.add('visible');
            }
        }

        setTimeout(typeNext, 600);

        // Clic n'importe où sur la page → login (sauf les boutons et l'overlay)
        document.body.addEventListener('click', function(e) {
            const overlay = document.getElementById('videoOverlay');
            if (overlay.classList.contains('active')) return;
            if (e.target.closest('#introButtons')) return;
            window.location.href = 'login.html';
        });

        // === Papa Swolio ===
        function playPapaSwolio() {
            const overlay = document.getElementById('videoOverlay');
            const video   = document.getElementById('swolio-video');
            overlay.classList.add('active');
            video.play();
            // Ferme automatiquement quand la vidéo est finie
            video.onended = () => closeVideo();
        }

        function closeVideo() {
            const overlay = document.getElementById('videoOverlay');
            const video   = document.getElementById('swolio-video');
            video.pause();
            video.currentTime = 0;
            overlay.classList.remove('active');
        }
    </script>
</body>
</html>
